name: Release

on:
  workflow_call:

concurrency:
  # github.workflow is the caller's name here, so use a group of our own to stay clear of the CI run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install commitizen
        uses: commitizen-tools/setup-cz@96c75e6ae9632047f2c9b4025b9dd1624b40de8f # v0.9.1
        with:
          python-version: "3.x"

      - name: Create changelog
        run: cz changelog --dry-run "$(cz version -p)" > .changelog.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(cz version -p)" --verify-tag --notes-file .changelog.md
