default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-vcs-permalinks" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  {
    id = "mixed-line-ending",
    args = [
      "--fix=lf",
    ]
  },
  { id = "check-symlinks" },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "f690817de25831a37094ca35af5ada05c909ff1c"  # frozen: v4.19.3
hooks = [{ id = "commitizen" }, { id = "commitizen-branch" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "d1df990f871e616da38bb602a2671d5e840b9989"  # frozen: 0.13.7
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "adf4d7a4e31d08d5f724660646c3f10e0084348d"  # frozen: v0.0.101
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "c0f278f1254ccc8fb09676bcdb8d847e7db493e5"  # frozen: v0.17.4
hooks = [{ id = "ruff-format" }, { id = "ruff-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "6f428aba5ced98b5a579ff23cab6b39822b4347d"  # frozen: v1.11.2
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]
