default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-vcs-permalinks" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  {
    id = "mixed-line-ending",
    args = [
      "--fix=lf",
    ]
  },
  { id = "check-symlinks" },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "57217c394fff5064bedd48421fe4b6f5f73aad47"  # frozen: v4.19.2
hooks = [{ id = "commitizen" }, { id = "commitizen-branch" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "dd409d04a3fa4a50f918dddb3ad3c6d8f46ab2cd"  # frozen: 0.13.4
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "413d39a1ae22e511c7d094682a0caf1486a49a36"  # frozen: v0.0.90
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "38bfb07c0c64c304f47eb52090f8288150c77730"  # frozen: v0.17.1
hooks = [{ id = "ruff-format" }, { id = "ruff-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "7c1739b6be770a7ccc8170a43993ccbb8e19dfb9"  # frozen: v1.8.9
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]
