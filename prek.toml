default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-vcs-permalinks" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  {
    id = "mixed-line-ending",
    args = [
      "--fix=lf",
    ]
  },
  { id = "check-symlinks" },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "f690817de25831a37094ca35af5ada05c909ff1c"  # frozen: v4.19.3
hooks = [{ id = "commitizen" }, { id = "commitizen-branch" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "d1df990f871e616da38bb602a2671d5e840b9989"  # frozen: 0.13.7
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "e4a50d912d68b67c54d09868c5ad11a1c787da00"  # frozen: v0.0.97
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c"  # frozen: v0.17.3
hooks = [{ id = "ruff-format" }, { id = "ruff-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "f26bd20264b5e50a1b1755cc2585b3464ca5c3b9"  # frozen: v1.10.0
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]
