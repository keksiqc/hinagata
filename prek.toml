default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-vcs-permalinks" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  {
    id = "mixed-line-ending",
    args = [
      "--fix=lf",
    ]
  },
  { id = "check-symlinks" },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "f690817de25831a37094ca35af5ada05c909ff1c"  # frozen: v4.19.3
hooks = [{ id = "commitizen" }, { id = "commitizen-branch" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "00eaed0068329eb6ca6bcb8de7b46c372d8d1c19"  # frozen: 0.13.9
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "53d9c26363b275be71a9342a87d55c0d1825cc06"  # frozen: v0.0.107
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
hooks = [{ id = "ruff-format" }, { id = "ruff-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "1066584123cce44a99b4818c2b2c4a7e732ff8e9"  # frozen: v1.11.3
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]
