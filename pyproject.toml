[project]
name = "hinagata"
version = "0.3.3"
description = "A lightweight CLI to generate project files like LICENSE and .gitignore."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keksi", email = "hello@keksi.dev" }]
keywords = ["boilerplate", "cli", "generator", "gitignore", "license"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
dependencies = [
  "questionary>=2.1.1",
  "typer>=0.27.3",
]

[project.urls]
Changelog = "https://github.com/keksiqc/hinagata/blob/main/CHANGELOG.md"
Documentation = "https://keksiqc.github.io/hinagata/"
Repository = "https://github.com/keksiqc/hinagata"

[project.scripts]
hina = "hinagata.cli:app"
hinagata = "hinagata.cli:app"

[dependency-groups]
dev = [
  "commitizen>=4.19.2",
  "coverage>=7.16.2",
  "prek>=0.5.5",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "rumdl>=0.2.79",
  "tombi>=1.8.6",
  "ty>=0.0.89",
]
docs = ["zensical>=0.0.71"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]
parallel = true
source = ["src"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = "tests"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120
output-format = "grouped"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
preview = true
select = [
  "correctness",
  "suspicious",
  "complexity",
  "performance",
  "style",
  "security",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
lines-after-imports = 2

[tool.rumdl]
cache-dir = ".cache/rumdl"

[tool.rumdl.per-file-flavor]
"docs/**/*.md" = "mkdocs"

[tool.rumdl.per-file-ignores]
"CHANGELOG.md" = ["MD041"]

[tool.tombi.files]
exclude = ["uv.lock"]
